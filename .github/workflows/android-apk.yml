# Builds the Android app in the cloud. Download the APK from the run's "Artifacts" section.
name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E '^(e: |.*error:|.*FAILED|.*What went wrong)' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SaisKitchen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
