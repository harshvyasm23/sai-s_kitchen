# Every push that changes android/ builds a signed APK and publishes it as the "latest" release.
# The installed app checks that release and offers a one-tap update.
name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sais.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/sais.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          elif [ -f android/sais.keystore ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/sais.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$(cat android/sais.keystore.password)" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found. APK is signed with a temporary key, so it cannot update an installed copy."
          fi

      - name: Build
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E '^(e: |.*error:|.*FAILED|.*What went wrong)' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }

      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SaisKitchen.apk
          gh release delete latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create latest SaisKitchen.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" --notes "versionCode: ${{ github.run_number }}" --latest
