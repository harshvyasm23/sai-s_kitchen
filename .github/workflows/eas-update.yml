# Every push to main publishes an over-the-air update to the Android/iPhone apps.
# One-time: add an Expo access token as a repo secret named EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
name: EAS Update
on:
  push:
    branches: [main]
    paths: ['expo/**']
jobs:
  update:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: expo } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm install --legacy-peer-deps
      - run: eas update --auto --non-interactive --channel preview
